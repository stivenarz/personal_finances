<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Aplicación de gestión de finanzas personales con almacenamiento local y funcionamiento offline">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finanzas">

    <title>Finanzas Personales - Control Integral</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23667eea' width='192' height='192'/><text x='96' y='120' font-size='120' font-weight='bold' fill='white' text-anchor='middle'>💰</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23667eea' width='180' height='180' rx='50'/><text x='90' y='130' font-size='100' fill='white' text-anchor='middle'>💰</text></svg>">

    <link rel="stylesheet" href="src/styles/main.css?v=6">
    <link rel="stylesheet" href="src/styles/components.css?v=5">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="loading-spinner" id="loading-spinner">
        <div class="spinner"></div>
        <p>Cargando datos...</p>
    </div>

    <div class="container">
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>💰 Finanzas</h1>
                <button class="sidebar-close" id="sidebar-close" aria-label="Cerrar menú">✕</button>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-view="dashboard"><span class="icon">📊</span> Dashboard</a>
                <a href="#" class="nav-item" data-view="cuentas"><span class="icon">🏦</span> Cuentas</a>
                <a href="#" class="nav-item" data-view="gastos"><span class="icon">💳</span> Gastos</a>
                <a href="#" class="nav-item" data-view="ingresos"><span class="icon">💵</span> Ingresos</a>
                <a href="#" class="nav-item" data-view="deudas"><span class="icon">📋</span> Deudas</a>
                <a href="#" class="nav-item" data-view="ahorros"><span class="icon">🎯</span> Ahorros</a>
                <a href="#" class="nav-item" data-view="planificacion"><span class="icon">🗓️</span> Planificación</a>
                <a href="#" class="nav-item" data-view="transacciones"><span class="icon">📝</span> Transacciones</a>
                <a href="#" class="nav-item" data-view="configuracion"><span class="icon">⚙️</span> Configuración</a>
            </nav>
            <div class="sidebar-footer">
                <span class="sync-badge" data-sync-badge>Cargando...</span>
                <p>Versión 2</p>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
                    <h2 id="view-title">Dashboard</h2>
                </div>
                <div class="header-right">
                    <div class="date-filter">
                        <label for="month-filter">Mes:</label>
                        <input type="month" id="month-filter" class="input-control">
                    </div>
                    <button class="btn btn-export" id="export-btn">📥 Exportar</button>
                </div>
            </header>

            <!-- Cada vista la construye su componente en src/features/<vista>/ -->
            <div class="views-container">
                <div class="view" id="view-dashboard"></div>
                <div class="view" id="view-cuentas"></div>
                <div class="view" id="view-gastos"></div>
                <div class="view" id="view-ingresos"></div>
                <div class="view" id="view-deudas"></div>
                <div class="view" id="view-ahorros"></div>
                <div class="view" id="view-planificacion"></div>
                <div class="view" id="view-transacciones"></div>
                <div class="view" id="view-configuracion"></div>
            </div>
        </main>
    </div>

    <script type="module" src="src/main.js?v=2"></script>
</body>
</html>
